<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tombol Hitung Mundur</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f4f4f9;
    }

    .container {
      text-align: center;
    }

    .btn {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
      text-decoration: none;
      display: inline-block;
    }

  
    #startBtn {
      background-color: #007bff;
    }

    #startBtn:disabled {
      background-color: #6c757d;
      cursor: not-allowed;
    }


    #linkBtn {
      background-color: #28a745;
      display: none;
    }

    #linkBtn:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>
  

  <div class="container">
    <button id="startBtn" class="btn" onclick="startTimer()">Klik untuk Mengunduh</button>
    
    <a id="linkBtn" class="btn" href="https://www.google.com" target="_blank">Menuju Link Tujuan</a>
  </div>

  <script>
    function startTimer() {
      let timeLeft = 10; 
      const startBtn = document.getElementById('startBtn');
      const linkBtn = document.getElementById('linkBtn');

      startBtn.disabled = true;
      startBtn.innerText = `Tunggu ${timeLeft} detik...`;

      const countdown = setInterval(() => {
        timeLeft--;
        
        if (timeLeft > 0) {
          startBtn.innerText = `Tunggu ${timeLeft} detik...`;
        } else {
          clearInterval(countdown);
          startBtn.style.display = 'none'; 
          linkBtn.style.display = 'inline-block'; 
        }
      }, 1000);
    }
  </script>

</body>
</html>
